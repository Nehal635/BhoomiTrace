version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: bhoomitrace_postgis
    environment:
      POSTGRES_USER: bhoomi_user
      POSTGRES_PASSWORD: bhoomi_password
      POSTGRES_DB: bhoomitrace_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  backend:
    build: ./backend
    container_name: bhoomitrace_backend
    volumes:
      - ./backend:/app
      - ./sample_data:/app/sample_data
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://bhoomi_user:bhoomi_password@db:5432/bhoomitrace_db
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    container_name: bhoomitrace_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
